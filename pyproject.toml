# pyproject.toml — canonical packaging config (PEP 517 / 518 / 621)
# Replaces setup.py.  Build with:  python -m build
# Install dev deps with: pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata  (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "pyu4v"
dynamic = ["version"]
description = "A Python library for use with Dell EMC's Unisphere for PowerMax REST API."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache-2.0"}
authors = [
    {name = "Dell Inc. or its subsidiaries", email = "paule.martin@dell.com"},
]
requires-python = ">=3.9, <4.0"
dependencies = [
    "requests>=2.28",
    # urllib3 is a transitive dependency of requests — not pinned separately
    # to avoid conflicts between urllib3 v1 and v2.
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
tools = ["prettytable>=3.0"]
dev   = ["pytest>=7.0", "testtools"]
docs  = ["sphinx>=7.0", "sphinx_rtd_theme>=2.0"]

[project.urls]
Homepage      = "https://github.com/dell/PyU4V/"
Documentation = "https://pyu4v.readthedocs.io/en/latest/"
Repository    = "https://github.com/dell/PyU4V/"
"Bug Tracker" = "https://github.com/dell/PyU4V/issues"

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["PyU4V*"]

[tool.setuptools.dynamic]
version = {attr = "PyU4V.version.VERSION"}

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths     = ["PyU4V/tests/unit_tests"]
python_files  = ["test_*.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]
