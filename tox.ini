# content of: tox.ini
[tox]
envlist = py39,py310,py311,py312,py313,pep8,pylint
[testenv]
setenv = VIRTUAL_ENV={envdir}
         PYTHONWARNINGS=default::DeprecationWarning

deps=
    pytest>=7.0
    testtools
commands=
    pytest {posargs} PyU4V/tests/unit_tests/
allowlist_externals =
    pytest

[testenv:ci]
basepython = python3
setenv = VIRTUAL_ENV={envdir}
         PYTHONWARNINGS=default::DeprecationWarning

deps=
    pytest>=7.0
    testtools
commands=
    pytest {posargs} PyU4V/tests/ci_tests/
allowlist_externals =
    pytest

[testenv:pep8]
basepython = python3
commands =
         flake8 {posargs} .
deps =
    flake8
    pep8-naming
    pydocstyle

[flake8]
ignore = N801,N802,N803,N806,N812,N818,W503,F523,E711
exclude = .git,.venv,.tox,dist,doc/ext,*egg,build, generate_functions.py

[testenv:pylint]
basepython = python3
deps =
    pylint

commands =
    pylint -j 4 --verbose --rcfile=.pylintrc PyU4V

whitelist_externals =
    find
